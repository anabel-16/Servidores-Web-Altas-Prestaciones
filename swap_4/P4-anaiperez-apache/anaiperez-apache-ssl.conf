<VirtualHost *:443>
    DocumentRoot /var/www/html/anaiperez

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/certificado_anaiperez_bundle.crt
    SSLCertificateKeyFile /etc/apache2/ssl/certificado_anaiperez.key

    SSLProtocol -all +TLSv1.2
    SSLCipherSuite HIGH:!MD5:!RC4:!3DES
    SSLHonorCipherOrder on
</VirtualHost>