version: '3.1'

services:

  # --- BALANCEADOR NGINX ---
  balanceador-nginx:
    container_name: balanceador-nginx-ssl
    build:
      context: .
      dockerfile: P4-anaiperez-nginx/DockerFileNginxP4
    image: anaiperez-nginx-image:p4
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./P4-anaiperez-nginx/anaiperez-nginx-ssl.conf:/etc/nginx/conf:ro
      - ./P4-anaiperez-certificados:/etc/nginx/ssl:ro
    networks:
      red_web:
        ipv4_address: 192.168.10.50
    depends_on:
      - web1
      - web2
      - web3
      - web4
      - web5
      - web6
      - web7
      - web8

  # --- SERVIDORES APACHE ---
  web1:
    container_name: web1
    build:
      context: .
      dockerfile: P4-anaiperez-apache/DockerFileApacheP4
    image: anaiperez-apache-image:p4
    cap_add:
      - NET_ADMIN
    volumes:
      - ./P4-anaiperez-apache/web_anaiperez:/var/www/html
      - ./P4-anaiperez-certificados:/etc/apache2/ssl:ro
    networks:
      red_web:
        ipv4_address: 192.168.10.2
      red_servicios:
        ipv4_address: 192.168.20.2
    hostname: web1

  web2:
    container_name: web2
    build:
      context: .
      dockerfile: P4-anaiperez-apache/DockerFileApacheP4
