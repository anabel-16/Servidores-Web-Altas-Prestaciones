      - NET_ADMIN
    volumes:
      - ./P4-anaiperez-apache/web_anaiperez:/var/www/html
      - ./P4-anaiperez-certificados:/etc/apache2/ssl:ro
    networks:
      red_web:
        ipv4_address: 192.168.10.3
      red_servicios:
        ipv4_address: 192.168.20.3
    hostname: web2

  web3:
