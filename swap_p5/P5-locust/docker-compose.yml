version: '3.1'

services:

  # --- LOCUST MASTER ---
  master-anaiperez:
    image: locustio/locust 
    ports:
      - "8089:8089"
    #container_name: master-anaiperez
    volumes:
      - ./:/mnt/locust
    command: -f /mnt/locust/locustfile.py --master -H https://192.168.10.50:443/
    networks:
      red_web:
        ipv4_address: 192.168.10.70

  # --- LOCUST WORKERS  ---
  worker-anaiperez:
    image: locustio/locust 
    volumes:
      - ./:/mnt/locust
    command: -f /mnt/locust/locustfile.py --worker --master-host master-anaiperez
    depends_on:
      - master-anaiperez
    deploy:
      replicas: 6
    networks:
      - red_web

# --- REDES EXTERNAS ---
networks:
  red_web:
    external: true
